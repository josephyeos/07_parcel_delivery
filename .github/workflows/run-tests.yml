name: Run pytest unit tests

# Run the tests automatically whenever changes are pushed to the repository
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository code onto the runner
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 3. Install pytest
      - name: Install pytest
        run: python -m pip install pytest

      # 4. Run all unit tests in the tests/ folder
      - name: Run unit tests
        run: python -m pytest -v
