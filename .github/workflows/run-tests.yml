name: Run pytest unit tests

on:
  # (B) Run on pushes to main only, not on every push to other branches
  push:
    branches: [main]
    # (A) Only run when relevant code changes
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/run-tests.yml"

  # (B) Run on pull requests into main, so code is tested before it is merged
  pull_request:
    branches: [main]
    # (A) Only run when relevant code changes
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/run-tests.yml"

# (C) If a newer run starts on the same branch or pull request,
#     cancel the older run that is still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository code onto the runner
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 3. Install pytest
      - name: Install pytest
        run: python -m pip install pytest

      # 4. Run all unit tests in the tests/ folder
      - name: Run unit tests
        run: python -m pytest -v
